html, body {

#card-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
}

    opacity: 1;
    pointer-events: auto;
}

.modal-content {
    position: relative;
    transform: scale(0.5);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

    transform: scale(1);
}

    position: absolute;
    top: -15px;
    right: -15px;
    background: #ffaa00;
    color: #fff;

    height: 35px;

    justify-content: center;
    align-items: center;
    font-size: 24px;

    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);

    transition: transform 0.2s;

.close-btn:hover {
    transform: scale(1.1);
    background: #ffcc00;

.magic-light {
    position: absolute;
    bottom: 14vmin;
    left: 50%;

    height: 6px;
    background-color: #ffff00;
    border-radius: 50%;

    pointer-events: none;

@keyframes float-magic {
    0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
    15% { opacity: 1; transform: translate(calc(-50% + (var(--x) * 0.2)), -5vmin) scale(1); }
    85% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--x)), -50vmin) scale(0.5); opacity: 0; }
}

@keyframes pulse-magic {
    0% { box-shadow: 0 0 4px #ffff00, 0 0 8px #ff9900; }
    100% { box-shadow: 0 0 12px #ffff00, 0 0 20px #ffaa00; background-color: #ffffee; }

.petal-wrapper {

@keyframes fall-petal {
    0% { transform: translateY(0) translateX(0); }
    100% { transform: translateY(120vh) translateX(15vw); }
}

@keyframes spin-petal {
    0% { transform: rotate(0deg) rotateX(0deg) rotateY(0deg); }
    100% { transform: rotate(360deg) rotateX(60deg) rotateY(60deg); }

    document.addEventListener("DOMContentLoaded", function() {
        const audio = new Audio("minecraft.mp3"); 
        audio.loop = true; 
        
        const playAudio = () => {
            audio.play().catch(error => {
                console.log("Reproducción automática bloqueada, esperando interacción del usuario.");
            });
        };
        
        playAudio();
        
        document.body.addEventListener("click", () => {
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });


      
        const allFlowers = document.querySelectorAll('.flower');
        const cardModal = document.getElementById('card-modal');
        const closeModalBtn = document.querySelector('.close-btn');
        const modalImage = document.getElementById('modal-image');

        const cartas = ['foto1.png', 'foto2.png', 'foto3.png', 'foto4.png', 'foto5.png', 'foto6.png', 'foto7.png'];

        allFlowers.forEach((flower, index) => {
            flower.addEventListener('click', (e) => {
                e.stopPropagation(); 
                
                modalImage.src = cartas[index % cartas.length];
                cardModal.classList.add('show');
            });
        });

        closeModalBtn.addEventListener('click', () => {
            cardModal.classList.remove('show');
        });

        cardModal.addEventListener('click', (e) => {
            if (e.target === cardModal) {
                cardModal.classList.remove('show');
            }
        });


        const flowerCups = document.querySelectorAll('.flower__leafs');

        function createMagicLight() {
            if(flowerCups.length === 0) return;
            
            const randomFlower = flowerCups[Math.floor(Math.random() * flowerCups.length)];
            
            const light = document.createElement('div');
            light.classList.add('magic-light');
            
            const randomX = (Math.random() - 0.5) * 60; 
            light.style.setProperty('--x', randomX + 'px');
            
            const floatDuration = Math.random() * 4 + 7; 
            const pulseDuration = Math.random() * 0.5 + 0.8;
            
            light.style.animation = `float-magic ${floatDuration}s linear forwards, pulse-magic ${pulseDuration}s alternate infinite`;
            
            randomFlower.appendChild(light);
            
            setTimeout(() => {
                light.remove();
            }, floatDuration * 1000); 
        }

        setInterval(createMagicLight, 400);


    
        const petalContainer = document.getElementById('falling-flower-container');
        
        function createFallingPetal() {
            const wrapper = document.createElement('div');
            wrapper.classList.add('petal-wrapper');
            
            wrapper.style.left = (Math.random() * 100) + 'vw';
            wrapper.style.animationDuration = (Math.random() * 10 + 12) + 's';

            const petal = document.createElement('div');
            petal.classList.add('falling-petal');
            
            const size = Math.random() * 8 + 10; 
            petal.style.width = size + 'px';
            petal.style.height = (size * 1.5) + 'px';
            
            petal.style.animationDuration = (Math.random() * 3 + 3) + 's'; 

            wrapper.appendChild(petal);
            petalContainer.appendChild(wrapper);
            
            setTimeout(() => {
                wrapper.remove();
            }, 23000); 
        }

        setInterval(createFallingPetal, 700);
    });
